<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Activity Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-200 pb-5 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 flex items-center gap-3">
                    <i class="fa-solid fa-chart-line text-indigo-600"></i> Activity Tracker
                </h1>
                <p class="text-slate-500 text-sm mt-1">Log & track daily progress effortlessly</p>
            </div>
            <button id="exportCsvBtn" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all shadow-sm">
                <i class="fa-solid fa-file-export"></i> Export CSV
            </button>
        </header>

        <!-- Summary Dashboard -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-400">Total Logs</p>
                    <h3 id="statTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-list-check"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-400">Avg Turns / Day</p>
                    <h3 id="statAvgTurns" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-rotate-left"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-400">Better Days</p>
                    <h3 id="statBetterDays" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-400">Status Overview</p>
                    <p id="statRatio" class="text-xs font-semibold text-slate-600 mt-2">0% B | 0% S | 0% W</p>
                </div>
                <div class="w-10 h-10 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Form Card -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm sticky top-8">
                    <h2 id="formTitle" class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100">
                        Add New Log
                    </h2>
                    
                    <form id="logForm" class="space-y-4">
                        <input type="hidden" id="editIndex" value="-1">

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1" for="logDate">Date *</label>
                            <input type="date" id="logDate" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1" for="logTurns">Number of Turns *</label>
                            <input type="number" id="logTurns" min="0" required placeholder="e.g. 5" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Status *</label>
                            <div class="grid grid-cols-3 gap-2">
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="Better" class="peer hidden" required>
                                    <div class="text-center py-2 px-1 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 peer-checked:bg-emerald-100 peer-checked:text-emerald-800 peer-checked:border-emerald-300 hover:bg-slate-50 transition-all">
                                        <i class="fa-regular fa-face-smile block text-base mb-1"></i> Better
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="Same" class="peer hidden">
                                    <div class="text-center py-2 px-1 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 peer-checked:bg-amber-100 peer-checked:text-amber-800 peer-checked:border-amber-300 hover:bg-slate-50 transition-all">
                                        <i class="fa-regular fa-face-meh block text-base mb-1"></i> Same
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="Worse" class="peer hidden">
                                    <div class="text-center py-2 px-1 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 peer-checked:bg-rose-100 peer-checked:text-rose-800 peer-checked:border-rose-300 hover:bg-slate-50 transition-all">
                                        <i class="fa-regular fa-face-frown block text-base mb-1"></i> Worse
                                    </div>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1" for="logComments">Comments</label>
                            <textarea id="logComments" rows="3" placeholder="Notes or observations..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"></textarea>
                        </div>

                        <div class="pt-2 flex gap-2">
                            <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-all shadow-sm">
                                <i class="fa-solid fa-plus mr-1"></i> Save Activity Log
                            </button>
                            <button type="button" id="cancelBtn" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 px-3 rounded-lg text-sm transition-all">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table & Search List -->
            <div class="lg:col-span-2 space-y-4">
                
                <!-- Filters Bar -->
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 justify-between items-center">
                    <div class="relative w-full md:w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" placeholder="Search comments or dates..." class="w-full pl-8 pr-3 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs">
                    </div>
                    
                    <div class="flex gap-2 w-full md:w-auto">
                        <select id="filterStatus" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="All">All Statuses</option>
                            <option value="Better">Better</option>
                            <option value="Same">Same</option>
                            <option value="Worse">Worse</option>
                        </select>
                        
                        <select id="sortOrder" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="date-desc">Newest First</option>
                            <option value="date-asc">Oldest First</option>
                            <option value="turns-desc">Turns (High-Low)</option>
                            <option value="turns-asc">Turns (Low-High)</option>
                        </select>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-[11px] uppercase font-bold text-slate-500 tracking-wider">
                                    <th class="py-3 px-4">Date</th>
                                    <th class="py-3 px-4">Turns</th>
                                    <th class="py-3 px-4">Status</th>
                                    <th class="py-3 px-4">Comments</th>
                                    <th class="py-3 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="logsTableBody" class="divide-y divide-slate-100 text-sm">
                                <!-- Dynamic rows populated via JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Empty State -->
                    <div id="emptyState" class="p-12 text-center text-slate-400">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
                        <p class="font-medium text-slate-600">No activity logs found.</p>
                        <p class="text-xs mt-1">Start by filling out the form on the left.</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-lg text-sm hidden transition-all duration-300 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Action completed successfully</span>
    </div>

    <script>
        // Data State Management
        let logs = JSON.parse(localStorage.getItem('daily_activity_logs')) || [];

        // DOM Elements
        const logForm = document.getElementById('logForm');
        const logDate = document.getElementById('logDate');
        const logTurns = document.getElementById('logTurns');
        const logComments = document.getElementById('logComments');
        const editIndex = document.getElementById('editIndex');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const logsTableBody = document.getElementById('logsTableBody');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const filterStatus = document.getElementById('filterStatus');
        const sortOrder = document.getElementById('sortOrder');
        const exportCsvBtn = document.getElementById('exportCsvBtn');

        // Dashboard Stat Elements
        const statTotal = document.getElementById('statTotal');
        const statAvgTurns = document.getElementById('statAvgTurns');
        const statBetterDays = document.getElementById('statBetterDays');
        const statRatio = document.getElementById('statRatio');

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            logDate.valueAsDate = new Date();
            renderLogs();
        });

        // Save / Update Log
        logForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const selectedStatus = document.querySelector('input[name="status"]:checked')?.value;
            if (!selectedStatus) {
                showToast('Please select a status', 'error');
                return;
            }

            const newLog = {
                id: editIndex.value !== "-1" ? logs[editIndex.value].id : Date.now(),
                date: logDate.value,
                turns: parseInt(logTurns.value, 10),
                status: selectedStatus,
                comments: logComments.value.trim()
            };

            if (editIndex.value === "-1") {
                logs.push(newLog);
                showToast('Activity log added');
            } else {
                logs[editIndex.value] = newLog;
                showToast('Activity log updated');
                resetForm();
            }

            saveAndRefresh();
        });

        // Edit Log
        window.editLog = function(id) {
            const index = logs.findIndex(item => item.id === id);
            if (index === -1) return;

            const item = logs[index];
            editIndex.value = index;
            logDate.value = item.date;
            logTurns.value = item.turns;
            logComments.value = item.comments;

            const statusRadio = document.querySelector(`input[name="status"][value="${item.status}"]`);
            if (statusRadio) statusRadio.checked = true;

            formTitle.textContent = "Edit Activity Log";
            submitBtn.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Update Log`;
            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Cancel Edit
        cancelBtn.addEventListener('click', resetForm);

        function resetForm() {
            editIndex.value = "-1";
            logForm.reset();
            logDate.valueAsDate = new Date();
            formTitle.textContent = "Add New Log";
            submitBtn.innerHTML = `<i class="fa-solid fa-plus mr-1"></i> Save Activity Log`;
            cancelBtn.classList.add('hidden');
        }

        // Delete Log
        window.deleteLog = function(id) {
            if (confirm('Are you sure you want to delete this record?')) {
                logs = logs.filter(item => item.id !== id);
                saveAndRefresh();
                showToast('Record deleted');
            }
        };

        // Save & Refresh Data
        function saveAndRefresh() {
            localStorage.setItem('daily_activity_logs', JSON.stringify(logs));
            renderLogs();
        }

        // Render Logs Table and Stats
        function renderLogs() {
            let filteredLogs = [...logs];

            // Search filter
            const query = searchInput.value.toLowerCase();
            if (query) {
                filteredLogs = filteredLogs.filter(item => 
                    item.comments.toLowerCase().includes(query) || 
                    item.date.includes(query)
                );
            }

            // Status filter
            const statusVal = filterStatus.value;
            if (statusVal !== 'All') {
                filteredLogs = filteredLogs.filter(item => item.status === statusVal);
            }

            // Sorting
            const sortVal = sortOrder.value;
            filteredLogs.sort((a, b) => {
                if (sortVal === 'date-desc') return new Date(b.date) - new Date(a.date);
                if (sortVal === 'date-asc') return new Date(a.date) - new Date(b.date);
                if (sortVal === 'turns-desc') return b.turns - a.turns;
                if (sortVal === 'turns-asc') return a.turns - b.turns;
            });

            // Update Table Display
            logsTableBody.innerHTML = '';
            
            if (filteredLogs.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filteredLogs.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50 transition-all";

                    let statusBadge = '';
                    if (item.status === 'Better') {
                        statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800"><i class="fa-regular fa-face-smile"></i> Better</span>`;
                    } else if (item.status === 'Same') {
                        statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800"><i class="fa-regular fa-face-meh"></i> Same</span>`;
                    } else {
                        statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-800"><i class="fa-regular fa-face-frown"></i> Worse</span>`;
                    }

                    row.innerHTML = `
                        <td class="py-3 px-4 font-medium text-slate-900 whitespace-nowrap">${formatDate(item.date)}</td>
                        <td class="py-3 px-4 font-semibold text-slate-700">${item.turns}</td>
                        <td class="py-3 px-4 whitespace-nowrap">${statusBadge}</td>
                        <td class="py-3 px-4 text-slate-600 max-w-xs truncate">${escapeHTML(item.comments) || '<span class="text-slate-300 italic">None</span>'}</td>
                        <td class="py-3 px-4 text-right whitespace-nowrap">
                            <button onclick="editLog(${item.id})" class="text-slate-400 hover:text-indigo-600 p-1.5 transition-colors mr-1" title="Edit">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteLog(${item.id})" class="text-slate-400 hover:text-rose-600 p-1.5 transition-colors" title="Delete">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;
                    logsTableBody.appendChild(row);
                });
            }

            updateDashboardStats();
        }

        // Update Dashboard Statistics
        function updateDashboardStats() {
            const total = logs.length;
            statTotal.textContent = total;

            if (total === 0) {
                statAvgTurns.textContent = '0';
                statBetterDays.textContent = '0';
                statRatio.textContent = '0% B | 0% S | 0% W';
                return;
            }

            const totalTurns = logs.reduce((acc, curr) => acc + curr.turns, 0);
            statAvgTurns.textContent = (totalTurns / total).toFixed(1);

            const betterCount = logs.filter(l => l.status === 'Better').length;
            const sameCount = logs.filter(l => l.status === 'Same').length;
            const worseCount = logs.filter(l => l.status === 'Worse').length;

            statBetterDays.textContent = betterCount;

            const bPct = Math.round((betterCount / total) * 100);
            const sPct = Math.round((sameCount / total) * 100);
            const wPct = Math.round((worseCount / total) * 100);

            statRatio.textContent = `${bPct}% B | ${sPct}% S | ${wPct}% W`;
        }

        // CSV Export Functionality
        exportCsvBtn.addEventListener('click', () => {
            if (logs.length === 0) {
                showToast('No records available to export', 'error');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Date,Turns,Status,Comments\n";
            logs.forEach(row => {
                const safeComments = `"${(row.comments || '').replace(/"/g, '""')}"`;
                csvContent += `${row.date},${row.turns},${row.status},${safeComments}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `activity_logs_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('CSV Exported successfully');
        });

        // Search & Filter Listeners
        searchInput.addEventListener('input', renderLogs);
        filterStatus.addEventListener('change', renderLogs);
        sortOrder.addEventListener('change', renderLogs);

        // Helper Utilities
        function formatDate(dateStr) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            const [y, m, d] = dateStr.split('-');
            return new Date(y, m - 1, d).toLocaleDateString(undefined, options);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = msg;
            toast.classList.remove('hidden');

            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }
    </script>
</body>
</html>
